services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # InfluxDB e Historian (cadastro de CLPs/tags) NÃO moram mais aqui — são
  # o projeto separado "wtecc-historian", que pode rodar nesta mesma máquina
  # ou em outro servidor. O backend aponta pra eles pela rede, via
  # INFLUX_URL/HISTORIAN_API_URL em backend/.env (ver install.sh).
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      # Sem isso o container roda em UTC por padrão — a detecção de turno do
      # OEE (hora_inicio/hora_fim) compara com o horário LOCAL do Brasil, e
      # ficava 3h adiantada (ex: 11h reais detectadas como Turno B, das
      # 14h-22h, em vez do Turno A).
      TZ: America/Sao_Paulo
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: http://${HOST_LAN_IP}:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
